<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Băile Felix - Monitorizare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MOBILE TOP NAV -->
    <header class="topbar">
        <div class="topbar-left">
            <button class="hamburger" id="hamburgerBtn" aria-label="Meniu">
                <span></span><span></span><span></span>
            </button>
            <span class="topbar-title">Băile Felix</span>
        </div>
        <div class="topbar-right">
            <span class="topbar-subtitle" id="topbarDevice">Niciun dispozitiv</span>
        </div>
    </header>

    <!-- OVERLAY for mobile sidebar -->
    <div class="overlay" id="overlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">⬡ Sonde Băile Felix</span>
            <button class="sidebar-close" id="sidebarClose">✕</button>
        </div>

        <nav class="sidebar-nav">

            <!-- Balint -->
            <div class="sonda-group">
                <div class="sonda-header">
                    <span class="sonda-label">Balint</span>
                    <button class="btn-view-all" data-sonda="1">Vezi toate</button>
                </div>
                <ul class="esp-list">
                    <li class="esp-item" data-id="pump_001" data-name="S1-V1" data-max="30">
                        <span class="esp-name">S1-V1</span>
                        <span class="status-dot" id="dot-pump_001"></span>
                    </li>
                    <li class="esp-item" data-id="pump_002" data-name="S2-V2" data-max="65">
                        <span class="esp-name">S2-V2</span>
                        <span class="status-dot" id="dot-pump_002"></span>
                    </li>
                </ul>
            </div>

            <!-- 4003 -->
            <div class="sonda-group">
                <div class="sonda-header">
                    <span class="sonda-label">4003</span>
                    <button class="btn-view-all" data-sonda="2">Vezi toate</button>
                </div>
                <ul class="esp-list">
                    <li class="esp-item" data-id="pump_003" data-name="S1-V1" data-max="33">
                        <span class="esp-name">S1-V1</span>
                        <span class="status-dot" id="dot-pump_003"></span>
                    </li>
                    <li class="esp-item" data-id="pump_004" data-name="S2-V2" data-max="31">
                        <span class="esp-name">S2-V2</span>
                        <span class="status-dot" id="dot-pump_004"></span>
                    </li>
                    <li class="esp-item" data-id="pump_005" data-name="S3-V3" data-max="11">
                        <span class="esp-name">S3-V3</span>
                        <span class="status-dot" id="dot-pump_005"></span>
                    </li>
                    <li class="esp-item" data-id="pump_006" data-name="S4-V4" data-max="25">
                        <span class="esp-name">S4-V4</span>
                        <span class="status-dot" id="dot-pump_006"></span>
                    </li>
                    <li class="esp-item" data-id="pump_007" data-name="S5-V5" data-max="12">
                        <span class="esp-name">S5-V5</span>
                        <span class="status-dot" id="dot-pump_007"></span>
                    </li>
                </ul>
            </div>

            <!-- 4011 -->
            <div class="sonda-group">
                <div class="sonda-header">
                    <span class="sonda-label">4011</span>
                    <button class="btn-view-all" data-sonda="3">Vezi toate</button>
                </div>
                <ul class="esp-list">
                    <li class="esp-item" data-id="pump_008" data-name="S1-V1" data-max="65">
                        <span class="esp-name">S1-V1</span>
                        <span class="status-dot" id="dot-pump_008"></span>
                    </li>
                    <li class="esp-item" data-id="pump_009" data-name="S2-V2" data-max="20">
                        <span class="esp-name">S2-V2</span>
                        <span class="status-dot" id="dot-pump_009"></span>
                    </li>
                    <li class="esp-item" data-id="pump_010" data-name="S3-V3" data-max="15">
                        <span class="esp-name">S3-V3</span>
                        <span class="status-dot" id="dot-pump_010"></span>
                    </li>
                </ul>
            </div>

        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <div class="placeholder" id="placeholderMessage">
            <div class="placeholder-icon">⬡</div>
            <p>Selectează un dispozitiv<br>sau apasă <strong>Vezi toate</strong></p>
        </div>

        <!-- Single device card -->
        <div class="device-card" id="controlCard">
            <div class="card-header">
                <div class="card-title-row">
                    <h2 class="card-device-name" id="currentDeviceTitle">--</h2>
                    <span class="status-badge" id="statusBadge">--</span>
                </div>
            </div>

            <div class="card-body">
                <div class="metric-block">
                    <span class="metric-label">Senzor Debit</span>
                    <span class="metric-value" id="sensorDisplay">--</span>
                    <span class="metric-unit">m³/h</span>
                </div>

                <div class="divider"></div>

                <div class="valve-block">
                    <span class="valve-label">Setare Debit</span>
                    <span class="valve-value" id="valveDisplay">--</span>
                </div>

                <div class="input-row">
                    <input type="number" id="valveInput" min="0" placeholder="0 – ?? m³/h">
                    <button class="btn-set" id="setValveBtn">Setează</button>
                </div>
                <button class="btn-emergency" id="emergencyBtn">⚠ Stop Urgență</button>
                <div class="error-msg" id="errorMsg">Valoare invalidă!</div>
            </div>
        </div>

        <!-- Grid view -->
        <div class="cards-grid" id="cardsGrid"></div>

    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
